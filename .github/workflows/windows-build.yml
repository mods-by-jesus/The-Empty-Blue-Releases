name: Windows game and launcher

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact game source commit (leave empty for a manual main build)
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: empty-blue-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout private game (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: mods-by-jesus/The-Empty-Blue
          ref: ${{ inputs.source_sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify requested source snapshot
        shell: pwsh
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($env:REQUESTED_SOURCE -and ($env:REQUESTED_SOURCE -notmatch '^[0-9a-f]{40}$' -or $actual -ne $env:REQUESTED_SOURCE)) {
            throw 'The checkout does not match the requested source commit'
          }
          Write-Host "Building source $actual"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Cache engine and Windows export template only
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-windows-${{ env.GODOT_VERSION }}-v1
      - name: Install matching Godot and export template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          $engine = Join-Path $tools "Godot_v$env:GODOT_VERSION-stable_win64.exe"
          if (!(Test-Path $engine)) {
            Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/editor.zip"
            Expand-Archive "$env:RUNNER_TEMP/editor.zip" $tools -Force
          }
          $template = Join-Path $tools 'windows_release_x86_64.exe'
          if (!(Test-Path $template)) {
            Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/templates.zip")
            try {
              $entry = $zip.Entries | Where-Object Name -eq 'windows_release_x86_64.exe' | Select-Object -First 1
              if (!$entry) { throw 'Windows export template missing' }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $template, $true)
            } finally { $zip.Dispose() }
          }
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item $template (Join-Path $templateDir 'windows_release_x86_64.exe')
          # Use the console entry point for piped CI output and synchronous exit
          # status. Keep the GUI binary installed beside its console wrapper.
          $consoleEngine = Join-Path $tools "Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          if (!(Test-Path $consoleEngine)) { throw 'Godot console entry point missing' }
          "GODOT=$consoleEngine" >> $env:GITHUB_ENV
      - name: Test launcher update safety
        shell: pwsh
        run: |
          ./scripts/distribution/TestReleaseDescription.ps1
          dotnet run --project launcher/tests/LauncherTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }
      - name: Import and validate Godot project
        shell: pwsh
        run: |
          & $env:GODOT --headless --path . --editor --import 2>&1 | Tee-Object "$env:RUNNER_TEMP/import.log"
          # On a clean checkout the project theme can load before its font is
          # imported. Godot still completes asset import, but returns nonzero.
          # Always run the strict second pass against the populated cache.
          if ($LASTEXITCODE -ne 0) { Write-Warning "Initial import returned $LASTEXITCODE; validating after asset bootstrap" }
          # First import can resolve scripts before new textures/fonts exist.
          # Validate again against the completed import, without hiding persistent errors.
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/validate.log" -Arguments @('--headless','--path','.','--editor','--import')
          if (Select-String -Path "$env:RUNNER_TEMP/validate.log" -Pattern 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading resource:') { throw 'Godot script/resource validation failed' }
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/app-icon.log" -Arguments @('--headless','--path','.','--script','res://scripts/tests/AppIconSmoke.gd')
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path "$env:RUNNER_TEMP/app-icon.log" -Pattern 'SCRIPT ERROR:|Parse Error:')) { throw "Application icon check failed (engine exit: $LASTEXITCODE)" }
          if (!(Select-String -Path "$env:RUNNER_TEMP/app-icon.log" -Pattern 'APP_ICON_SMOKE_OK')) { throw 'Application icon check incomplete' }
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/pause-settings.log" -Arguments @('--headless','--path','.','--script','res://scripts/tests/PauseSettingsMotionSmoke.gd')
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path "$env:RUNNER_TEMP/pause-settings.log" -Pattern 'SCRIPT ERROR:|Parse Error:')) { throw 'Pause settings check failed' }
          if (!(Select-String -Path "$env:RUNNER_TEMP/pause-settings.log" -Pattern 'PAUSE_SETTINGS_MOTION_SMOKE_OK')) { throw 'Pause settings check incomplete' }
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/fishing-equipment.log" -Arguments @('--headless','--path','.','--scene','res://scenes/tests/FishingEquipmentSmoke.tscn')
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path "$env:RUNNER_TEMP/fishing-equipment.log" -Pattern 'SCRIPT ERROR:|Parse Error:')) { throw 'Fishing/equipment check failed' }
          if (!(Select-String -Path "$env:RUNNER_TEMP/fishing-equipment.log" -Pattern 'FishingEquipmentSmoke PASS')) { throw 'Fishing/equipment check incomplete' }
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/twilight-ribbonfish.log" -Arguments @('--headless','--path','.','--scene','res://scenes/tests/TwilightRibbonfishSmoke.tscn')
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path "$env:RUNNER_TEMP/twilight-ribbonfish.log" -Pattern 'SCRIPT ERROR:|Parse Error:')) { throw 'Twilight Ribbonfish check failed' }
          if (!(Select-String -Path "$env:RUNNER_TEMP/twilight-ribbonfish.log" -Pattern 'TWILIGHT_RIBBONFISH_SMOKE_OK')) { throw 'Twilight Ribbonfish check incomplete' }
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/towing-net.log" -Arguments @('--headless','--path','.','--scene','res://scenes/tests/TowingNetSmoke.tscn')
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path "$env:RUNNER_TEMP/towing-net.log" -Pattern 'SCRIPT ERROR:|Parse Error:')) { throw 'Towing net check failed' }
          if (!(Select-String -Path "$env:RUNNER_TEMP/towing-net.log" -Pattern 'TowingNetSmoke PASS')) { throw 'Towing net check incomplete' }
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/simultaneous-fishing.log" -Arguments @('--headless','--path','.','--scene','res://scenes/tests/SimultaneousFishingSmoke.tscn')
          if (!(Select-String -Path "$env:RUNNER_TEMP/simultaneous-fishing.log" -Pattern 'SimultaneousFishingSmoke PASS')) { throw 'Simultaneous fishing check incomplete' }
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/crew-starvation.log" -Arguments @('--headless','--path','.','--scene','res://scenes/tests/CrewStarvationSmoke.tscn')
          if (!(Select-String -Path "$env:RUNNER_TEMP/crew-starvation.log" -Pattern 'CrewStarvationSmoke PASS')) { throw 'Crew starvation check incomplete' }
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/equipment-ui.log" -Arguments @('--headless','--path','.','--scene','res://scenes/tests/EquipmentInterfaceSmoke.tscn')
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path "$env:RUNNER_TEMP/equipment-ui.log" -Pattern 'SCRIPT ERROR:|Parse Error:')) { throw 'Equipment interface check failed' }
          if (!(Select-String -Path "$env:RUNNER_TEMP/equipment-ui.log" -Pattern 'EquipmentInterfaceSmoke PASS')) { throw 'Equipment interface check incomplete' }
          $performanceChecks = @{
            'LoadedCrewDeckPerformanceSmoke' = 'LOADED_CREW_DECK_PERFORMANCE_SMOKE_OK'
            'WarehousePerformanceSmoke' = 'WAREHOUSE_PERFORMANCE_SMOKE_OK'
            'PropellerMaskPerformanceSmoke' = 'PROPELLER_MASK_PERFORMANCE_SMOKE_OK'
            'RuntimeHotspotsSmoke' = 'RUNTIME_HOTSPOTS_SMOKE_OK'
            'CrewWorkerQuerySmoke' = 'CREW_WORKER_QUERY_SMOKE_OK'
            'WindMapCacheSmoke' = 'WIND_MAP_CACHE_SMOKE_OK'
          }
          foreach ($check in $performanceChecks.GetEnumerator()) {
            $log = "$env:RUNNER_TEMP/$($check.Key).log"
            ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath $log -Arguments @('--headless','--path','.','--scene',"res://scenes/tests/$($check.Key).tscn")
            if (!(Select-String -Path $log -Pattern $check.Value)) { throw "Performance regression check incomplete: $($check.Key)" }
          }
      - name: Test save compatibility, controls and first revision
        shell: pwsh
        run: |
          # Five separate processes: seed, three real restarts and cleanup.
          foreach ($stage in @('seed','verify','verify','verify','cleanup')) {
            ./scripts/distribution/TestFirstRevision.ps1 -GodotPath $env:GODOT -LogDirectory "$env:RUNNER_TEMP/revision-settings" -Checks @('SettingsPersistenceSmoke') -SettingsStage $stage
          }
          ./scripts/distribution/TestFirstRevision.ps1 -GodotPath $env:GODOT -LogDirectory "$env:RUNNER_TEMP/revision" -Checks @('ControlBindingsSmoke','SaveCompatibilitySmoke','SaveRevisionSmoke','SaveGameSmoke','UIInputLayoutSmoke','RevisionBalanceSmoke','WorldLootCapacitySmoke','CrewSystemSmoke','FieldServiceSmoke','TechCraftingSmoke','LootTablesSmoke','KesslerChainSmoke','CaptainProgressionSmoke','CaptainSpecializationSmoke','MoneyGainFeedbackSmoke')
      - name: Export Windows game
        shell: pwsh
        run: |
          $buildNumber = (git rev-list --count HEAD).Trim()
          "[build]`nnumber=$buildNumber" | Set-Content build_version.cfg -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force build/game | Out-Null
          ./scripts/distribution/InvokeGodotChecked.ps1 -GodotPath $env:GODOT -LogPath "$env:RUNNER_TEMP/export.log" -Arguments @('--headless','--path','.','--export-release','Windows Desktop','build/game/The Empty Blue.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Godot export failed' }
          if (Select-String -Path "$env:RUNNER_TEMP/export.log" -Pattern 'SCRIPT ERROR:|Parse Error:|Export failed') { throw 'Godot export errors' }
          if (!(Test-Path 'build/game/The Empty Blue.exe')) { throw 'Game executable missing' }
      - name: Export standalone launcher
        shell: pwsh
        run: |
          dotnet publish launcher/TheEmptyBlue.Launcher.csproj -c Release -r win-x64 --self-contained true -o build/launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
      - name: Test real launcher self-update
        shell: pwsh
        run: |
          ./scripts/distribution/TestLauncherSelfUpdate.ps1 -LauncherPath build/launcher/TheEmptyBlueLauncher.exe
          ./scripts/distribution/TestLauncherInterface.ps1 -LauncherPath build/launcher/TheEmptyBlueLauncher.exe
      - name: Check exported game startup
        shell: pwsh
        run: |
          $startup = Start-Process -FilePath 'build/game/The Empty Blue.exe' -ArgumentList @('--headless','--quit-after','120','--log-file',"$env:RUNNER_TEMP/startup.log") -Wait -PassThru -NoNewWindow
          if ($startup.ExitCode -ne 0) { throw 'Exported game failed to start' }
          if (!(Test-Path "$env:RUNNER_TEMP/startup.log")) { throw 'Exported game did not create its startup log' }
          if (Select-String -Path "$env:RUNNER_TEMP/startup.log" -Pattern 'SCRIPT ERROR:|Parse Error:') { throw 'Exported game has script errors' }
          # Release templates disable scene overrides. Test the exported pack with
          # the matching editor binary, not loose project files or the release CLI.
          $exportedGame = (Resolve-Path 'build/game/The Empty Blue.exe').Path
          $effects = Start-Process -FilePath $env:GODOT -ArgumentList @('--headless','--main-pack',"`"$exportedGame`"",'--scene','res://scenes/tests/TechDeviceEffectsSmoke.tscn','--quit-after','600','--log-file',"`"$env:RUNNER_TEMP/tech-effects.log`"") -Wait -PassThru -NoNewWindow
          if ($effects.ExitCode -ne 0 -or !(Test-Path "$env:RUNNER_TEMP/tech-effects.log")) { throw 'Exported tech device check failed' }
          if (Select-String -Path "$env:RUNNER_TEMP/tech-effects.log" -Pattern 'SCRIPT ERROR:|Parse Error:') { throw 'Exported tech devices have script errors' }
          if (!(Select-String -Path "$env:RUNNER_TEMP/tech-effects.log" -Pattern 'TECH_DEVICE_EFFECTS_SMOKE_OK')) { throw 'Exported tech device effects or activation failed' }
      - name: Package immutable release
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $tag = "build-$($commit.Substring(0,12))"
          New-Item -ItemType Directory -Force build/release | Out-Null
          Compress-Archive -Path build/game/* -DestinationPath build/release/TheEmptyBlue-Windows-x64.zip
          Copy-Item build/launcher/TheEmptyBlueLauncher.exe build/release/Launcher.exe
          $hash = (Get-FileHash build/release/TheEmptyBlue-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherHash = (Get-FileHash build/release/Launcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherSize = (Get-Item build/release/Launcher.exe).Length
          $previousCommit = ''
          try { $previousCommit = (Invoke-RestMethod 'https://github.com/mods-by-jesus/The-Empty-Blue-Releases/releases/latest/download/manifest.json').commit } catch { Write-Host 'No previous manifest available; using curated description' }
          $descriptionRu = ./scripts/distribution/GetReleaseDescription.ps1 -PreviousCommit $previousCommit -Language ru
          $descriptionEn = ./scripts/distribution/GetReleaseDescription.ps1 -PreviousCommit $previousCommit -Language en
          $notesRu = $descriptionRu.Notes
          $notesEn = $descriptionEn.Notes
          $buildNumber = [int](git rev-list --count HEAD)
          $launcherVersion = ([xml](Get-Content launcher/TheEmptyBlue.Launcher.csproj -Raw)).Project.PropertyGroup.Version
          @{schema=1;version=$tag;commit=$commit;buildNumber=$buildNumber;builtUtc=[DateTime]::UtcNow.ToString('O');fileName='TheEmptyBlue-Windows-x64.zip';sha256=$hash;executable='The Empty Blue.exe';launcherSha256=$launcherHash;launcherSize=$launcherSize;launcherVersion=$launcherVersion;notesRu=$notesRu;notesEn=$notesEn;titleRu=$descriptionRu.Title;titleEn=$descriptionEn.Title} | ConvertTo-Json | Set-Content build/release/manifest.json -Encoding utf8NoBOM
          "Версия: v$buildNumber`n`n$notesRu`n`n---`n`n$notesEn" | Set-Content build/release/notes.txt -Encoding utf8NoBOM
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "BUILD_NUMBER=$buildNumber" >> $env:GITHUB_ENV
          "RELEASE_TITLE=The Empty Blue v$buildNumber — $($descriptionRu.Title)" >> $env:GITHUB_ENV
      - name: Publish only completed builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -eq 'false') { Write-Host 'This version is already published'; exit 0 }
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft --title $env:RELEASE_TITLE --notes-file build/release/notes.txt
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG build/release/Launcher.exe build/release/TheEmptyBlue-Windows-x64.zip build/release/manifest.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed (draft remains hidden)' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
