name: Windows game and launcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empty-blue-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout private game (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: mods-by-jesus/The-Empty-Blue
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Cache engine and Windows export template only
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-windows-${{ env.GODOT_VERSION }}-v1
      - name: Install matching Godot and export template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          $engine = Join-Path $tools "Godot_v$env:GODOT_VERSION-stable_win64.exe"
          if (!(Test-Path $engine)) {
            Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/editor.zip"
            Expand-Archive "$env:RUNNER_TEMP/editor.zip" $tools -Force
          }
          $template = Join-Path $tools 'windows_release_x86_64.exe'
          if (!(Test-Path $template)) {
            Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/templates.zip")
            try {
              $entry = $zip.Entries | Where-Object Name -eq 'windows_release_x86_64.exe' | Select-Object -First 1
              if (!$entry) { throw 'Windows export template missing' }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $template, $true)
            } finally { $zip.Dispose() }
          }
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item $template (Join-Path $templateDir 'windows_release_x86_64.exe')
          "GODOT=$engine" >> $env:GITHUB_ENV
      - name: Test launcher update safety
        shell: pwsh
        run: |
          dotnet run --project launcher/tests/LauncherTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }
      - name: Import and validate Godot project
        shell: pwsh
        run: |
          & $env:GODOT --headless --path . --editor --import 2>&1 | Tee-Object "$env:RUNNER_TEMP/import.log"
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
          # First import can resolve scripts before new textures/fonts exist.
          # Validate again against the completed import, without hiding persistent errors.
          & $env:GODOT --headless --path . --editor --import 2>&1 | Tee-Object "$env:RUNNER_TEMP/validate.log"
          if ($LASTEXITCODE -ne 0) { throw 'Godot validation failed' }
          if (Select-String -Path "$env:RUNNER_TEMP/validate.log" -Pattern 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading resource:') { throw 'Godot script/resource validation failed' }
          & $env:GODOT --headless --path . --script res://scripts/tests/AppIconSmoke.gd 2>&1 | Tee-Object "$env:RUNNER_TEMP/app-icon.log"
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path "$env:RUNNER_TEMP/app-icon.log" -Pattern 'SCRIPT ERROR:|Parse Error:')) { throw "Application icon check failed (engine exit: $LASTEXITCODE)" }
          if (!(Select-String -Path "$env:RUNNER_TEMP/app-icon.log" -Pattern 'APP_ICON_SMOKE_OK')) { throw 'Application icon check incomplete' }
      - name: Export Windows game
        shell: pwsh
        run: |
          $buildNumber = (git rev-list --count HEAD).Trim()
          "[build]`nnumber=$buildNumber" | Set-Content build_version.cfg -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force build/game | Out-Null
          & $env:GODOT --headless --path . --export-release 'Windows Desktop' 'build/game/The Empty Blue.exe' 2>&1 | Tee-Object "$env:RUNNER_TEMP/export.log"
          if ($LASTEXITCODE -ne 0) { throw 'Godot export failed' }
          if (Select-String -Path "$env:RUNNER_TEMP/export.log" -Pattern 'SCRIPT ERROR:|Parse Error:|Export failed') { throw 'Godot export errors' }
          if (!(Test-Path 'build/game/The Empty Blue.exe')) { throw 'Game executable missing' }
      - name: Export standalone launcher
        shell: pwsh
        run: |
          dotnet publish launcher/TheEmptyBlue.Launcher.csproj -c Release -r win-x64 --self-contained true -o build/launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
      - name: Test real launcher self-update
        shell: pwsh
        run: |
          ./scripts/distribution/TestLauncherSelfUpdate.ps1 -LauncherPath build/launcher/TheEmptyBlueLauncher.exe
      - name: Check exported game startup
        shell: pwsh
        run: |
          $startup = Start-Process -FilePath 'build/game/The Empty Blue.exe' -ArgumentList @('--headless','--quit-after','120','--log-file',"$env:RUNNER_TEMP/startup.log") -Wait -PassThru -NoNewWindow
          if ($startup.ExitCode -ne 0) { throw 'Exported game failed to start' }
          if (!(Test-Path "$env:RUNNER_TEMP/startup.log")) { throw 'Exported game did not create its startup log' }
          if (Select-String -Path "$env:RUNNER_TEMP/startup.log" -Pattern 'SCRIPT ERROR:|Parse Error:') { throw 'Exported game has script errors' }
          # Release templates disable scene overrides. Test the exported pack with
          # the matching editor binary, not loose project files or the release CLI.
          $exportedGame = (Resolve-Path 'build/game/The Empty Blue.exe').Path
          $effects = Start-Process -FilePath $env:GODOT -ArgumentList @('--headless','--main-pack',"`"$exportedGame`"",'--scene','res://scenes/tests/TechDeviceEffectsSmoke.tscn','--quit-after','600','--log-file',"`"$env:RUNNER_TEMP/tech-effects.log`"") -Wait -PassThru -NoNewWindow
          if ($effects.ExitCode -ne 0 -or !(Test-Path "$env:RUNNER_TEMP/tech-effects.log")) { throw 'Exported tech device check failed' }
          if (Select-String -Path "$env:RUNNER_TEMP/tech-effects.log" -Pattern 'SCRIPT ERROR:|Parse Error:') { throw 'Exported tech devices have script errors' }
          if (!(Select-String -Path "$env:RUNNER_TEMP/tech-effects.log" -Pattern 'TECH_DEVICE_EFFECTS_SMOKE_OK')) { throw 'Exported tech device effects or activation failed' }
      - name: Package immutable release
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $tag = "build-$($commit.Substring(0,12))"
          New-Item -ItemType Directory -Force build/release | Out-Null
          Compress-Archive -Path build/game/* -DestinationPath build/release/TheEmptyBlue-Windows-x64.zip
          Copy-Item build/launcher/TheEmptyBlueLauncher.exe build/release/Launcher.exe
          $hash = (Get-FileHash build/release/TheEmptyBlue-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherHash = (Get-FileHash build/release/Launcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherSize = (Get-Item build/release/Launcher.exe).Length
          $notesRu = Get-Content distribution/release-notes.ru.md -Raw
          $notesEn = Get-Content distribution/release-notes.en.md -Raw
          $buildNumber = [int](git rev-list --count HEAD)
          @{schema=1;version=$tag;commit=$commit;buildNumber=$buildNumber;builtUtc=[DateTime]::UtcNow.ToString('O');fileName='TheEmptyBlue-Windows-x64.zip';sha256=$hash;executable='The Empty Blue.exe';launcherSha256=$launcherHash;launcherSize=$launcherSize;launcherVersion='2.0.0';notesRu=$notesRu;notesEn=$notesEn} | ConvertTo-Json | Set-Content build/release/manifest.json -Encoding utf8NoBOM
          "Версия: v$buildNumber`n`n$notesRu`n`n---`n`n$notesEn" | Set-Content build/release/notes.txt -Encoding utf8NoBOM
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "BUILD_NUMBER=$buildNumber" >> $env:GITHUB_ENV
      - name: Publish only completed builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -eq 'false') { Write-Host 'This version is already published'; exit 0 }
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft --title "The Empty Blue v$env:BUILD_NUMBER" --notes-file build/release/notes.txt
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG build/release/Launcher.exe build/release/TheEmptyBlue-Windows-x64.zip build/release/manifest.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed (draft remains hidden)' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
